version: "1.1.0"
snapshot_cutoff: "2026-06-30T23:59:59Z"
principles:
  - Scores describe observability and implementation state, not protocol quality or safety.
  - Unknown evidence produces null, never a guessed zero.
  - Economic importance uses the reproducible ecosystem snapshot and is not a market-share estimate.

score_ranges:
  economic_importance_score:
    direction: higher_is_more_observed_economic_footprint
    range: [0, 4]
    rules:
      - {score: 4, condition: "integrations >= 50 OR tagged TVL sum >= 1,000,000,000 USD"}
      - {score: 3, condition: "integrations >= 20 OR tagged TVL sum >= 100,000,000 USD"}
      - {score: 2, condition: "integrations >= 5 OR tagged TVL sum >= 10,000,000 USD"}
      - {score: 1, condition: "integrations >= 1 OR tagged TVL sum > 0 USD"}
      - {score: 0, condition: "no integration and zero tagged TVL in the source snapshot"}
  reward_observability_score:
    direction: higher_is_more_reconstructable
    range: [0, 4]
    rules:
      - {score: 4, condition: "event ledger built and cash-flow or structural QC complete"}
      - {score: 3, condition: "on-chain interface identified; collection pending RPC"}
      - {score: 2, condition: "partially observable or interface not yet complete"}
      - {score: 1, condition: "mechanism documented but no reconstructable interface verified"}
      - {score: 0, condition: "verified absent from the scoped mechanism"}
      - {score: null, condition: "not audited or evidence unknown"}
  penalty_observability_score:
    direction: higher_is_more_reconstructable
    range: [0, 4]
    rules:
      - {score: 4, condition: "event ledger built and cash-flow or structural QC complete"}
      - {score: 3, condition: "on-chain interface identified; collection pending RPC"}
      - {score: 2, condition: "partially observable or interface not yet complete"}
      - {score: 1, condition: "mechanism documented but no reconstructable interface verified"}
      - {score: 0, condition: "verified absent from the scoped mechanism"}
      - {score: null, condition: "not audited or evidence unknown"}
  truth_linkability_score:
    direction: higher_is_more_explicitly_linked_to_protocol_recognized_reliability
    range: [0, 4]
    rules:
      - {score: 4, condition: "event-level outcome linked to adjudication, consensus band, or external-reference ruling"}
      - {score: 3, condition: "service-window reliability condition linked to an identified feed/configuration"}
      - {score: 2, condition: "aggregate outcome linkable but actor/event attribution incomplete"}
      - {score: 1, condition: "only undisputed acceptance or indirect reliability evidence"}
      - {score: 0, condition: "verified no truth/reliability link in scope"}
      - {score: null, condition: "not audited or evidence unknown"}
  historical_depth_score:
    direction: higher_is_more_historical_coverage
    range: [0, 4]
    rules:
      - {score: 4, condition: "QC-complete event history >= 3 years"}
      - {score: 3, condition: "QC-complete event history >= 2 years"}
      - {score: 2, condition: "QC-complete event history >= 1 year"}
      - {score: 1, condition: "QC-complete event history > 0 and < 1 year"}
      - {score: 0, condition: "verified mechanism has no historical events in scope"}
      - {score: null, condition: "history not collected or coverage unknown"}
  implementation_cost_score:
    direction: higher_is_more_costly
    range: [1, 5]
    rules:
      - {score: 1, condition: "QC-complete local adapter and data are available"}
      - {score: 2, condition: "single EVM security chain with documented contracts"}
      - {score: 3, condition: "multiple contracts/epochs or off-chain proofs require reconciliation"}
      - {score: 4, condition: "non-EVM/custom chain plus protocol-specific decoding"}
      - {score: 5, condition: "no verified economic interface or security chain yet"}
      - {score: null, condition: "not audited"}

