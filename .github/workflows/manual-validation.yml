name: Case reproducibility
on:
  push:
    branches: [main, 'review/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-colab.txt
      - run: python scripts/check_repository.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/run_pipeline.py --output runs/ci-case
      - run: python scripts/replay_pyth_snapshot.py --output runs/ci-pyth
      - run: python scripts/execute_notebook.py --output runs/ci-notebook
